name: Release gprinter RPM

# Builds the Fedora RPM (rastertotspl filter + GP-1324D PPD) and attaches it to
# the GitHub Release for the pushed tag. Consumed by the pack_server Kinoite
# image (image/Containerfile, GPRINTER_RPM_URL).
#
# Cut a release:  git tag v1.1.0 && git push origin v1.1.0
# Asset produced: gprinter-1324d-driver-<ver>-1.fc43.x86_64.rpm
# Keep the build container's Fedora version in step with the Kinoite base.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      - name: Install build tooling
        run: dnf install -y rpm-build rpmdevtools git tar

      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build RPM
        run: |
          rpmdev-setuptree
          cp rastertotspl gprinter_1324D.ppd ~/rpmbuild/SOURCES/
          rpmbuild -bb packaging/gprinter-1324d-driver.spec \
            --define "_version ${{ steps.ver.outputs.version }}"
          mkdir -p dist
          cp ~/rpmbuild/RPMS/x86_64/*.rpm dist/
          ls -l dist/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.rpm
